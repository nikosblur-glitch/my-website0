<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support | VortexBots</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --blurple: #5865F2;
      --blurple-hover: #4752C4;
      --bg: #0b0d17;
      --card: rgba(255,255,255,0.05);
      --text: #ffffff;
      --muted: #a0a0b0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); }
    nav {
      position: fixed; top: 0; width: 100%; z-index: 1000;
      background: rgba(11,13,23,0.85); backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center;
    }
    .logo { font-size: 1.6rem; font-weight: 700; background: linear-gradient(90deg, #5865F2, #eb459e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a { color: var(--muted); text-decoration: none; font-weight: 500; }
    .nav-links a:hover, .nav-links a.active { color: white; }
    .cart-btn { background: var(--blurple); color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 8px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 0.5rem; text-decoration: none; }
    .page-header { padding: 8rem 2rem 2rem; text-align: center; }
    .page-header h1 { font-size: 2.8rem; margin-bottom: 0.5rem; }
    .page-header p { color: var(--muted); }
    .support-container {
      max-width: 700px; margin: 0 auto 5rem; padding: 0 2rem;
    }
    .ticket-form {
      background: var(--card); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px; padding: 2.5rem;
    }
    .form-group { margin-bottom: 1.5rem; }
    label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
    input, select, textarea {
      width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px; padding: 0.9rem 1rem; color: white; font-size: 1rem;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--blurple); }
    textarea { min-height: 140px; resize: vertical; }
    .submit-btn {
      width: 100%; background: var(--blurple); color: white; border: none;
      padding: 1rem; border-radius: 12px; font-weight: 600; font-size: 1.1rem; cursor: pointer;
    }
    .submit-btn:hover { background: var(--blurple-hover); }
    .success-msg {
      display: none; text-align: center; padding: 2rem; background: rgba(87,242,135,0.1);
      border: 1px solid #57F287; border-radius: 16px; margin-top: 2rem;
    }
    footer { text-align: center; padding: 2rem; color: var(--muted); border-top: 1px solid rgba(255,255,255,0.08); }
    @media (max-width: 768px) { .nav-links { display: none; } }
  </style>
</head>
<body>
  <nav>
    <div class="logo">VortexBots</div>
    <ul class="nav-links">
      <li><a href="index.html">Αρχική</a></li>
      <li><a href="bots.html">Bots</a></li>
      <li><a href="hosting.html">Hosting</a></li>
      <li><a href="support.html" class="active">Support</a></li>
    </ul>
    <a href="cart.html" class="cart-btn"><i class="fas fa-shopping-cart"></i> <span id="cart-count">0</span></a>
  </nav>

  <div class="page-header">
    <h1>Support Tickets</h1>
    <p>Άνοιξε ticket και θα απαντήσουμε μέσα σε λίγες ώρες.</p>
  </div>

  <div class="support-container">
    <form class="ticket-form" id="ticketForm">
      <div class="form-group">
        <label>Όνομα / Discord Username</label>
        <input type="text" id="name" required placeholder="π.χ. User#1234">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required placeholder="email@example.com">
      </div>
      <div class="form-group">
        <label>Κατηγορία</label>
        <select id="category" required>
          <option value="">Επίλεξε...</option>
          <option value="bot">Πρόβλημα με Bot</option>
          <option value="hosting">Hosting Issue</option>
          <option value="payment">Πληρωμή / Άδεια</option>
          <option value="feature">Αίτημα Feature</option>
          <option value="other">Άλλο</option>
        </select>
      </div>
      <div class="form-group">
        <label>Θέμα</label>
        <input type="text" id="subject" required placeholder="Σύντομη περιγραφή">
      </div>
      <div class="form-group">
        <label>Μήνυμα</label>
        <textarea id="message" required placeholder="Περίγραψε το πρόβλημα όσο πιο αναλυτικά μπορείς..."></textarea>
      </div>
      <button type="submit" class="submit-btn">Υποβολή Ticket</button>
    </form>

    <div class="success-msg" id="successMsg">
      <h3 style="color:#57F287; margin-bottom:0.5rem;">✅ Ticket υποβλήθηκε!</h3>
      <p>Το ticket σου καταχωρήθηκε. Θα λάβεις απάντηση στο email σου σύντομα.<br>Ticket ID: <strong id="ticketId"></strong></p>
    </div>
  </div>

  <footer>© 2026 VortexBots</footer>

  <script>
    document.getElementById('ticketForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const id = 'VB-' + Math.floor(100000 + Math.random() * 900000);
      document.getElementById('ticketId').textContent = id;
      document.getElementById('ticketForm').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';

      // Αποθήκευση τοπικά (για demo)
      let tickets = JSON.parse(localStorage.getItem('vortexTickets') || '[]');
      tickets.push({
        id,
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        category: document.getElementById('category').value,
        subject: document.getElementById('subject').value,
        message: document.getElementById('message').value,
        date: new Date().toISOString()
      });
      localStorage.setItem('vortexTickets', JSON.stringify(tickets));
    });

    function updateCartCount() {
      const cart = JSON.parse(localStorage.getItem('vortexCart') || '[]');
      document.getElementById('cart-count').textContent = cart.length;
    }
    updateCartCount();
  </script>
</body>
</html>
